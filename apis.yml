description: 'Pacaso is a proptech company that operates a luxury vacation-home co-ownership
  platform, letting individuals buy a fractional share of a professionally managed second
  home. It handles the LLC ownership structure, financing, scheduling, cleaning, maintenance,
  and full property management for co-owners across premium destinations in the US, Europe,
  Mexico, and other resort markets. Surfaced as a portfolio company of Fifth Wall and the
  SoftBank Vision Fund and added to the API Evangelist network. Pacaso publishes no public
  API or developer program at this time; this profile carries identity and domain-security
  signals only.'
